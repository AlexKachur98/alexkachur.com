name: ci

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # npm test builds the site first (pretest), and the eval reads that build.
      - run: npm test
      - run: npm run eval
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
